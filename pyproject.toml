[project]
name = "low-resource-qa-representation"
version = "0.1.0"
description = "Benchmarking LLMs on multilingual question answering: direct vs. translate-pivot pipelines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Franck Fongang" },
]
keywords = ["multilingual", "nlp", "benchmark", "llm", "question-answering", "low-resource-languages"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "anthropic>=0.84.0",
    "google-genai>=1.51.0",
    "numpy>=2.4.3",
    "openai>=2.28.0",
    "python-dotenv>=1.1.0",
    "pandas>=3.0.1",
    "requests>=2.32.5",
    "sentence-transformers>=5.3.0",
    "transformers>=5.3.0",
    "torch>=2.6.0",
    "pyyaml>=6.0",
    "tiktoken>=0.12.0",
    "sentencepiece>=0.2.0",
    "protobuf>=5.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11.0",
    "mypy>=1.15",
]
analysis = [
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "jupyter>=1.0",
]
training = [
    "peft>=0.18.1",
    "trl>=0.29.0",
    "bitsandbytes>=0.49.2",
    "accelerate>=1.13.0",
    "datasets>=4.8.3",
    "torch>=2.6.0",
]

[project.urls]
Repository = "https://github.com/Francklin9999/low-resource-qa-representation"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true

